version: '3.9'

services:
  servicio-usuarios:
    build: ./microservicio-usuarios
    image: microservicio-usuarios-dev:v1
    container_name: microservicio-usuarios-dev
    volumes:
      - ./microservicio-usuarios:/app
    ports:
      - "3000:3000"
    depends_on:
      mysql-usuarios:
        condition: service_healthy
    env_file:
      - ./microservicio-usuarios/.env
  
  mysql-usuarios:
    image: mysql:latest
    container_name: mysql-usuarios-dev
    ports:
      - "${DB_DEV_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_DEV_PASSWORD}
      - MYSQL_DATABASE=${DB_DEV_DATABASE}
      - MYSQL_USER=${DB_DEV_USERNAME}
      - MYSQL_PASSWORD=${DB_DEV_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
